# Proposed dedicated runtime configuration, schema 1.
# The current Lux executable DOES NOT read this file.
# AmnesiaDedicatedConfig validates it; it does not host a game.

[server]
schema = 1
bind_address = 0.0.0.0
port = 27020
max_players = 2
max_datagram_bytes = 1200

[simulation]
tick_hz = 60
player_snapshot_hz = 60
world_snapshot_hz = 20
pause_when_empty = true

[campaign]
game_data_dir = /opt/amnesia/game
start_map = maps/main/ch01/00_rainy_hall.map

[saves]
directory = /var/lib/amnesia-coop/saves
autosave_seconds = 60
resume_on_start = true

[logging]
directory = /var/log/amnesia-coop
